services:
  minecraft:
    image: itzg/minecraft-server:java21
    ports:
      - "127.0.0.1:25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: "1.21.4"
      MEMORY: 2G
      ONLINE_MODE: "FALSE"
      MAX_PLAYERS: "1"
      VIEW_DISTANCE: "6"
      SIMULATION_DISTANCE: "4"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "local-only-minecraft"
    volumes:
      - browser-test-world:/data
volumes:
  browser-test-world:
